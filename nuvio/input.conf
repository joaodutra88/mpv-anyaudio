# Keys for Nuvio Desktop. Nuvio never forwards the keyboard to mpv, so the shim reads
# this file itself. Supported key names: F1..F12 and CTRL+<0-9|A-Z>.
F6 script-binding anyaudio/grab
F7 script-binding anyaudio/apply
F8 script-binding anyaudio/clear
F9 add audio-delay -0.1; show-text "audio delay: ${audio-delay}"
F10 add audio-delay 0.1; show-text "audio delay: ${audio-delay}"
